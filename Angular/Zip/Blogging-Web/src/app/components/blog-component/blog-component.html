<section class="container" style="--bs-danger-rgb: 138, 3, 3;">
    <h2 class="mb-4 text-danger fw-bold">Publicar noticia</h2>

    <div class="d-flex flex-column bg-white border border-2 border-danger rounded p-4">
        <div class="mb-3">
            <label class="form-label fw-bold text-danger" for="titulo">Título</label>
            <input class="form-control border-danger" type="text" name="titulo" id="titulo"
                placeholder="Introduce el título" [(ngModel)]="newNoticia.titulo">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-danger" for="imagen">Imagen (URL)</label>
            <input class="form-control border-danger" type="text" name="imagen" id="imagen"
                placeholder="https://..." [(ngModel)]="newNoticia.imagen">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-danger" for="texto">Texto</label>
            <textarea class="form-control border-danger" rows="4" name="texto" id="texto"
                placeholder="Escribe el contenido de la noticia" [(ngModel)]="newNoticia.texto"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-danger" for="fecha">Fecha</label>
            <input class="form-control border-danger" type="date" name="fecha" id="fecha"
                [(ngModel)]="newNoticia.fecha">
        </div>

        <div class="d-flex">
            <button class="btn btn-danger" (click)="guardarDatos()"
                style="--bs-btn-bg: #8a0303; --bs-btn-border-color: #8a0303; --bs-btn-hover-bg: #5c0202; --bs-btn-hover-border-color: #5c0202;">Publicar</button>
        </div>
    </div>

    <hr class="my-5 text-danger border-2 opacity-100">

    <h2 class="mb-4 text-danger fw-bold">Listado de noticias</h2>
    <div [innerHTML]="cargarDatos()"></div>
</section>
