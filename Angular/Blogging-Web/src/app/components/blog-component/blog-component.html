<section class="container">
    <h2 class="mb-4">Publicar noticia</h2>

    <div class="formulario">
        <div class="mb-3">
            <label class="form-label" for="titulo">Título</label>
            <input class="form-control" type="text" name="titulo" id="titulo"
                placeholder="Introduce el título" [(ngModel)]="newNoticia.titulo">
        </div>

        <div class="mb-3">
            <label class="form-label" for="imagen">Imagen (URL)</label>
            <input class="form-control" type="text" name="imagen" id="imagen"
                placeholder="https://..." [(ngModel)]="newNoticia.imagen">
        </div>

        <div class="mb-3">
            <label class="form-label" for="texto">Texto</label>
            <textarea class="form-control" rows="4" name="texto" id="texto"
                placeholder="Escribe el contenido de la noticia" [(ngModel)]="newNoticia.texto"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label" for="fecha">Fecha</label>
            <input class="form-control" type="date" name="fecha" id="fecha"
                [(ngModel)]="newNoticia.fecha">
        </div>

        <button class="btn btn-primary" (click)="guardarDatos()">Publicar</button>
    </div>

    <hr class="my-5">

    <h2 class="mb-4">Listado de noticias</h2>
    <div [innerHTML]="cargarDatos()"></div>
</section>
